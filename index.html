<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blink</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .app-container::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.4) 100%);
      z-index: 1;
    }
    .top-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
    }
    .app-logo {
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .feed-tabs {
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 15px;
    }
    .feed-tabs span {
      opacity: 0.6;
    }
    .feed-tabs span.active {
      opacity: 1;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }
    .actions {
      position: absolute;
      right: 15px;
      bottom: 120px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }
    .icon-circle {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .bottom-info {
      position: relative;
      z-index: 2;
      margin-bottom: 60px;
      max-width: 80%;
    }
    .username {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .description {
      font-size: 14px;
      line-height: 1.3;
      opacity: 0.9;
    }
    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55px;
      background-color: #000;
      z-index: 3;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 0.5px solid rgba(255,255,255,0.1);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active {
      color: #fff;
    }
    .nav-icon {
      font-size: 18px;
      margin-bottom: 2px;
    }
    .upload-btn {
      width: 38px;
      height: 28px;
      background: linear-gradient(90deg, #00f2fe, #ff0050);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="video-card" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80');">
      <div class="overlay"></div>
      
      <div class="top-header">
        <div class="app-logo">Blink</div>
        <div class="feed-tabs">
          <span>Following</span>
          <span class="active">For You</span>
        </div>
        <div style="width: 40px;"></div>
      </div>

      <div class="actions">
        <div class="action-btn"><div class="icon-circle">❤️</div><span>12.5k</span></div>
        <div class="action-btn"><div class="icon-circle">💬</div><span>342</span></div>
        <div class="action-btn"><div class="icon-circle">🔗</div><span>Share</span></div>
      </div>

      <div class="bottom-info">
        <div class="username">@thetlin_dev</div>
        <div class="description">Welcome to Blink! 🚀 Swipe up for more content. #Blink #Shorts</div>
      </div>
    </div>

    <div class="video-card" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');">
      <div class="overlay"></div>
      
      <div class="top-header">
        <div class="app-logo">Blink</div>
        <div class="feed-tabs">
          <span>Following</span>
          <span class="active">For You</span>
        </div>
        <div style="width: 40px;"></div>
      </div>

      <div class="actions">
        <div class="action-btn"><div class="icon-circle">❤️</div><span>45.2k</span></div>
        <div class="action-btn"><div class="icon-circle">💬</div><span>890</span></div>
        <div class="action-btn"><div class="icon-circle">🔗</div><span>Share</span></div>
      </div>

      <div class="bottom-info">
        <div class="username">@nature_explorer</div>
        <div class="description">Beautiful sunset vibes 🌅✨ #nature #travel #Blink</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item active">
      <div class="nav-icon">🏠</div>
      <span>Home</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">🔍</div>
      <span>Discover</span>
    </div>
    <div class="upload-btn">+</div>
    <div class="nav-item">
      <div class="nav-icon">💬</div>
      <span>Inbox</span>
    </div>
    <div class="nav-item">
      <div class="nav-icon">👤</div>
      <span>Profile</span>
    </div>
  </div>

</body>
</html>
