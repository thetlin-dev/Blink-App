<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blink</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    /* Main Content Area */
    .content-area {
      flex: 1;
      height: calc(100vh - 65px);
      position: relative;
      overflow: hidden;
    }

    /* Feed View */
    .feed-view {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .feed-view::-webkit-scrollbar {
      display: none;
    }
    .video-card {
      position: relative;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
      z-index: 1;
      pointer-events: none;
    }
    .top-header {
      position: absolute;
      top: 15px;
      left: 20px;
      right: 20px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-logo {
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 1px;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .feed-tabs {
      display: flex;
      gap: 15px;
      font-weight: bold;
      font-size: 15px;
    }
    .feed-tabs span {
      opacity: 0.6;
    }
    .feed-tabs span.active {
      opacity: 1;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }
    .actions {
      position: absolute;
      right: 15px;
      bottom: 40px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }
    .icon-circle {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 4px;
      transition: transform 0.2s, background 0.2s;
    }
    .icon-circle.liked {
      background: rgba(255, 0, 80, 0.8);
      transform: scale(1.1);
    }
    .bottom-info {
      position: absolute;
      left: 20px;
      bottom: 25px;
      z-index: 2;
      max-width: 75%;
    }
    .username {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .description {
      font-size: 14px;
      line-height: 1.3;
      opacity: 0.9;
    }

    /* Profile View */
    .profile-view {
      display: none;
      width: 100%;
      height: 100%;
      background: #000;
      overflow-y: auto;
      padding: 20px;
      text-align: center;
    }
    .profile-header {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff0050, #00f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 12px;
    }
    .profile-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .profile-bio {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
    }
    .stats-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    .stat-value {
      font-weight: bold;
      font-size: 16px;
    }
    .stat-label {
      font-size: 12px;
      color: #888;
    }
    .edit-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      padding: 8px 24px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    .grid-item {
      width: 100%;
      height: 130px;
      background-size: cover;
      background-position: center;
    }

    /* Fixed Bottom Nav Bar */
    .bottom-nav {
      width: 100%;
      height: 65px;
      background-color: #000;
      z-index: 999;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 0.5px solid rgba(255,255,255,0.15);
      padding-bottom: 10px;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 10px;
      color: #888;
      cursor: pointer;
    }
    .nav-item.active {
      color: #fff;
    }
    .nav-icon {
      font-size: 20px;
      margin-bottom: 2px;
    }
    .upload-btn {
      width: 42px;
      height: 30px;
      background: linear-gradient(90deg, #00f2fe, #ff0050);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="content-area">
      <div id="feedPage" class="feed-view">
        
        <div class="video-card" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80');">
          <video loop playsinline autoplay muted src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
          <div class="overlay"></div>
          <div class="top-header">
            <div class="app-logo">Blink</div>
            <div class="feed-tabs">
              <span>Following</span>
              <span class="active">For You</span>
            </div>
            <div style="width: 40px;"></div>
          </div>
          <div class="actions">
            <div class="action-btn"
