<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blink App - Short Feed</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    /* Feed Container (Vertical Scroll) */
    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
    }
    .app-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
    /* Video Card */
    .video-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    /* Overlay Gradient */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 40%, rgba(0,0,0,0.3) 100%);
      z-index: 1;
    }
    /* Top Header */
    .top-header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 10px;
    }
    .top-header span {
      opacity: 0.7;
    }
    .top-header span.active {
      opacity: 1;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }
    /* Right Action Buttons */
    .actions {
      position: absolute;
      right: 15px;
      bottom: 80px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 12px;
      cursor: pointer;
    }
    .icon-circle {
      width: 45px;
      height: 45px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 4px;
    }
    /* Bottom Info Section */
    .bottom-info {
      position: relative;
      z-index: 2;
      margin-bottom: 20px;
      max-width: 80%;
    }
    .username {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }
    .description {
      font-size: 14px;
      line-height: 1.3;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="video-card" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80');">
      <div class="overlay"></div>
      <div class="top-header">
        <span>Following</span>
        <span class="active">For You</span>
      </div>
      <div class="actions">
        <div class="action-btn"><div class="icon-circle">❤️</div><span>12.5k</span></div>
        <div class="action-btn"><div class="icon-circle">💬</div><span>342</span></div>
        <div class="action-btn"><div class="icon-circle">🔗</div><span>Share</span></div>
      </div>
      <div class="bottom-info">
        <div class="username">@thetlin_dev</div>
        <div class="description">Welcome to Blink App! 🚀 Swipe up for more content. #BlinkApp #Dev</div>
      </div>
    </div>

    <div class="video-card" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80');">
      <div class="overlay"></div>
      <div class="top-header">
        <span>Following</span>
        <span class="active">For You</span>
      </div>
      <div class="actions">
        <div class="action-btn"><div class="icon-circle">❤️</div><span>45.2k</span></div>
        <div class="action-btn"><div class="icon-circle">💬</div><span>890</span></div>
        <div class="action-btn"><div class="icon-circle">🔗</div><span>Share</span></div>
      </div>
      <div class="bottom-info">
        <div class="username">@nature_explorer</div>
        <div class="description">Beautiful sunset vibes 🌅✨ #nature #travel</div>
      </div>
    </div>
  </div>

</body>
</html>
