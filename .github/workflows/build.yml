name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Check Directory Structure
        run: ls -R

      - name: Install Dependencies
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
          elif [ -f "Blink-App/pubspec.yaml" ]; then
            cd Blink-App && flutter pub get
          else
            find . -name "pubspec.yaml" -execdir flutter pub get \;
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter build apk --split-per-abi
          elif [ -f "Blink-App/pubspec.yaml" ]; then
            cd Blink-App && flutter build apk --split-per-abi
          else
            TARGET_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
            cd $TARGET_DIR && flutter build apk --split-per-abi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: '**/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk'
